profiles:
  target: dev
  outputs:
    dev:
      type: duckdb
    athena:
      type: athena
      s3_staging_dir: "s3://bucket-name/path/to/staging"
      s3_data_dir: "s3://bucket-name/path/to/data"
      s3_data_naming: path
      region_name: us-west-2
      database: db_name
      schema: schema_name
      threads: 10
      num_retries: 5
    snowflake:
      type: snowflake
      account: account_name
      user: user_name
      password: password
      role: role_name
      warehouse: warehouse_name
      database: database_name
      schema: schema_name
      threads: "10"
      client_session_keep_alive: "{{ env_var('CLIENT_SESSION_KEEP_ALIVE', false) }}"
      retry_on_database_errors: true
      retry_all: 1
extra_profiles:
  target: dev
  outputs:
    dev:
      type: duckdb
